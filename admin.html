<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>CRM</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>CRM Dashboard</h1>

<!-- SEARCH -->
<input id="search" placeholder="Поиск лидов..." />

<!-- STATS -->
<div class="stats">
  <div>💰 Всего: <span id="totalMoney">0</span></div>
  <div>🟡 Новые: <span id="countNew">0</span></div>
  <div>🟢 Завершено: <span id="countDone">0</span></div>
</div>

<!-- KANBAN -->
<div class="board">

  <div class="column" id="col-new">
    <h2>🟡 Новые</h2>
    <div class="column-body"></div>
  </div>

  <div class="column" id="col-in_work">
    <h2>🔵 В работе</h2>
    <div class="column-body"></div>
  </div>

  <div class="column" id="col-waiting">
    <h2>🟣 Ожидание</h2>
    <div class="column-body"></div>
  </div>

  <div class="column" id="col-done">
    <h2>🟢 Готово</h2>
    <div class="column-body"></div>
  </div>

</div>

<script src="admin.js"></script>
</body>
</html>
